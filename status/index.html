<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TPS Meter</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        color: var(--oc-fg);
        font: 12px/1.4 var(--oc-font);
      }

      * {
        box-sizing: border-box;
      }

      #root {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 2px 0 4px;
      }

      .tps-note {
        color: var(--oc-warning-text, var(--oc-fg));
      }

      .tps-note[data-tone='muted'] {
        color: var(--oc-muted);
      }

      .tps-line {
        display: grid;
        grid-template-columns: 84px minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        min-height: 18px;
      }

      .tps-what {
        color: var(--oc-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .tps-detail {
        min-width: 0;
        color: var(--oc-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

      .tps-value {
        text-align: right;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

      .tps-value[data-quiet='true'] {
        color: var(--oc-muted);
      }

      .tps-meter {
        height: 4px;
        border-radius: 2px;
        background: color-mix(in srgb, var(--oc-fg) 8%, transparent);
        overflow: hidden;
      }

      .tps-meter-fill {
        width: 100%;
        height: 100%;
        background: var(--oc-primary);
        transform-origin: left center;
        transform: scaleX(0);
        transition: transform 160ms linear;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="main.js"></script>
  </body>
</html>
